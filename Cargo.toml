[workspace]
resolver = "3"
# The crates under review while the core event vocabulary is settled. The layers built on top of
# it are parked in `exclude` below and come back one at a time, so a change to the vocabulary is
# not a change to every crate at once.
members = ["crates/xenolith", "crates/xenolith-fuzz"]
# The libFuzzer targets need a nightly toolchain, so they are built when someone chooses to fuzz
# rather than by every `cargo build --workspace`.
#
# The rest are parked, not abandoned: each returns to `members` once the vocabulary it builds on
# has settled. A parked crate is not compiled, so its manifest and its use of the workspace's
# inherited fields are not read either.
exclude = [
  "fuzz",
  "crates/xenolith-cli",
  "crates/xenolith-exslt",
  "crates/xenolith-xdm",
  "crates/xenolith-xinclude",
  "crates/xenolith-xpath",
  "crates/xenolith-xslt",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/torao/xenolith"
authors = ["TAKAMI Torao"]
# crates.io allows five keywords, and its search already reads the description — so these are
# spent on the terms that earn a listing page of their own rather than on repeating the blurb.
# `dom` is deliberately absent: that page is front-end crates, and "xml dom" finds us anyway.
keywords = ["xml", "xslt", "xpath", "dtd", "sax"]
# The default for every crate here. A category is a claim about what a crate *is*, so the two
# narrower ones are set by the crates they are true of rather than inherited by all thirteen.
categories = ["parser-implementations", "text-processing"]

[workspace.dependencies]
# Inter-crate dependencies default their features off so each crate re-exports only what it
# means to; see the feature policy in ROADMAP.md.
xenolith-xinclude = { version = "0.0.0", path = "crates/xenolith-xinclude", default-features = false }
xenolith-xdm = { version = "0.0.0", path = "crates/xenolith-xdm", default-features = false }
xenolith-xpath = { version = "0.0.0", path = "crates/xenolith-xpath", default-features = false }
xenolith-xslt = { version = "0.0.0", path = "crates/xenolith-xslt", default-features = false }
xenolith-exslt = { version = "0.0.0", path = "crates/xenolith-exslt", default-features = false }
xenolith = { version = "0.0.0", path = "crates/xenolith", default-features = false }
# Argument parsing for the `xenolith` binary. No library crate depends on it.
clap = { version = "4", features = ["derive", "wrap_help"] }
encoding_rs = "0.8"
# Derives `Display` and `Error` for `ErrorKind`, so each variant owns its own wording and its
# structured payload. A build-time proc-macro with no runtime footprint; MSRV 1.61.
thiserror = "2"
# The collation `xsl:sort` needs for a language other than code-point order (ROADMAP decision 2).
# EXSLT's regular-expressions module. A linear-time matcher: no backreferences or lookaround,
# and in exchange no pattern that can be made to run for ever by its input.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
icu_collator = "2"
icu_locale_core = "2"
# The runtime-agnostic async-read trait for the `async` driver. Traits only, no executor, so the
# runtime stays the caller's business.
futures-io = { version = "0.3", default-features = false, features = ["std"] }
# Only `AsyncRead` is needed; the runtime is the caller's business.
tokio = { version = "1", default-features = false, features = ["io-util"] }
# Adapts tokio's own `AsyncRead` to `futures_io::AsyncRead` for the `tokio` convenience
# constructors; only pulled in by the `tokio` feature.
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }
# Benchmarking. Default features off: the plotting and the parallel sampler pull in a great deal
# for a number this does not need prettier.
criterion = { version = "0.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
