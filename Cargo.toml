[workspace]
resolver = "3"
members = ["crates/*"]
# The libFuzzer targets need a nightly toolchain, so they are built when someone chooses to fuzz
# rather than by every `cargo build --workspace`. The properties they check are in
# `crates/xylogue-fuzz`, which is a member and is tested like everything else.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/torao/xylogue"
authors = ["TAKAMI Torao"]
keywords = ["xml", "xpath", "xslt", "dom"]
categories = ["parser-implementations", "text-processing"]

[workspace.dependencies]
# Inter-crate dependencies default their features off so each crate re-exports only what it
# means to; see the feature policy in ROADMAP.md.
xylogue-core = { version = "0.0.0", path = "crates/xylogue-core", default-features = false }
xylogue-parser = { version = "0.0.0", path = "crates/xylogue-parser", default-features = false }
xylogue-validate = { version = "0.0.0", path = "crates/xylogue-validate", default-features = false }
xylogue-dom = { version = "0.0.0", path = "crates/xylogue-dom", default-features = false }
xylogue-serialize = { version = "0.0.0", path = "crates/xylogue-serialize", default-features = false }
xylogue-xinclude = { version = "0.0.0", path = "crates/xylogue-xinclude", default-features = false }
xylogue-xdm = { version = "0.0.0", path = "crates/xylogue-xdm", default-features = false }
xylogue-xpath = { version = "0.0.0", path = "crates/xylogue-xpath", default-features = false }
xylogue-xslt = { version = "0.0.0", path = "crates/xylogue-xslt", default-features = false }
xylogue-exslt = { version = "0.0.0", path = "crates/xylogue-exslt", default-features = false }
xylogue = { version = "0.0.0", path = "crates/xylogue", default-features = false }
# Argument parsing for the `xylogue` binary. No library crate depends on it.
clap = { version = "4", features = ["derive", "wrap_help"] }
encoding_rs = "0.8"
# The collation `xsl:sort` needs for a language other than code-point order (ROADMAP decision 2).
# EXSLT's regular-expressions module. A linear-time matcher: no backreferences or lookaround,
# and in exchange no pattern that can be made to run for ever by its input.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
icu_collator = "2"
icu_locale_core = "2"
# Only `AsyncRead` is needed; the runtime is the caller's business.
tokio = { version = "1", default-features = false, features = ["io-util"] }
# Benchmarking. Default features off: the plotting and the parallel sampler pull in a great deal
# for a number this does not need prettier.
criterion = { version = "0.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
