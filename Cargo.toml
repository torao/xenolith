[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/torao/xylograph"
authors = ["TAKAMI Torao"]
keywords = ["xml", "xpath", "xslt", "dom"]
categories = ["parser-implementations", "text-processing"]

[workspace.dependencies]
# Inter-crate dependencies default their features off so each crate re-exports only what it
# means to; see the feature policy in ROADMAP.md.
xylograph-core = { version = "0.0.0", path = "crates/xylograph-core", default-features = false }
xylograph-parser = { version = "0.0.0", path = "crates/xylograph-parser", default-features = false }
xylograph-validate = { version = "0.0.0", path = "crates/xylograph-validate", default-features = false }
xylograph-dom = { version = "0.0.0", path = "crates/xylograph-dom", default-features = false }
xylograph-serialize = { version = "0.0.0", path = "crates/xylograph-serialize", default-features = false }
xylograph-xinclude = { version = "0.0.0", path = "crates/xylograph-xinclude", default-features = false }
xylograph-xdm = { version = "0.0.0", path = "crates/xylograph-xdm", default-features = false }
xylograph-xpath = { version = "0.0.0", path = "crates/xylograph-xpath", default-features = false }
xylograph-xslt = { version = "0.0.0", path = "crates/xylograph-xslt", default-features = false }
xylograph-exslt = { version = "0.0.0", path = "crates/xylograph-exslt", default-features = false }
xylograph = { version = "0.0.0", path = "crates/xylograph", default-features = false }
# Argument parsing for the `xylo` binary. No library crate depends on it.
clap = { version = "4", features = ["derive", "wrap_help"] }
encoding_rs = "0.8"
# The collation `xsl:sort` needs for a language other than code-point order (ROADMAP decision 2).
# EXSLT's regular-expressions module. A linear-time matcher: no backreferences or lookaround,
# and in exchange no pattern that can be made to run for ever by its input.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
icu_collator = "2"
icu_locale_core = "2"
# Only `AsyncRead` is needed; the runtime is the caller's business.
tokio = { version = "1", default-features = false, features = ["io-util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
