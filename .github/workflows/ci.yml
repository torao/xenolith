name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  features:
    # The feature policy (see ROADMAP.md §6) promises that a build with every optional
    # capability removed still works, so the minimal configuration is built and tested here
    # rather than being assumed.
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-default-features
      - run: cargo test --workspace --no-default-features --features encodings
      - run: cargo test -p xylograph-parser --no-default-features --features tokio
      # Each optional layer built on its own, so a feature that only compiles alongside another
      # does not slip through the all-features and no-features runs.
      - run: cargo test -p xylograph-parser --no-default-features --features xml-base
      - run: cargo test -p xylograph-parser --no-default-features --features xml-id
      - run: cargo test -p xylograph-validate --no-default-features --features xml-id
      - run: cargo test -p xylograph-dom --no-default-features --features parse
      - run: cargo test -p xylograph-xinclude --no-default-features --features encodings

  conformance:
    # The W3C suite is thousands of files and is not vendored; it is fetched here so the
    # parser and validator are measured against something they did not write, on every push
    # rather than only when someone remembers.
    name: W3C conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the XML conformance suite
        run: |
          curl -sSfL -o xmlts.tar.gz https://www.w3.org/XML/Test/xmlts20130923.tar.gz
          tar xf xmlts.tar.gz
      - name: Parser conformance (well-formedness)
        run: cargo test -p xylograph-parser --test conformance -- --nocapture
        env:
          XMLCONF: ${{ github.workspace }}/xmlconf
      - name: Validator conformance (validity)
        run: cargo test -p xylograph-validate --all-features --test conformance -- --nocapture
        env:
          XMLCONF: ${{ github.workspace }}/xmlconf
      # Printed on every run so that what the specifications leave open, and what this build
      # answers, is on the record beside the conformance figures rather than only in prose.
      - name: Report the behaviour the specifications leave open
        run: cargo test -p xylograph --all-features --test behaviour -- --nocapture

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-features
