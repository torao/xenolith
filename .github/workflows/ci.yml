name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  features:
    # The feature policy (see ROADMAP.md §6) promises that a build with every optional
    # capability removed still works, so the minimal configuration is built and tested here
    # rather than being assumed.
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `xylogue-cli` and `xylogue-fuzz` are left out of these two: both name the library's features
      # outright, so building them alongside would unify the features back on and the minimal
      # configuration — the thing this job exists to build — would never be built at all.
      - run: cargo test --workspace --exclude xylogue-cli --exclude xylogue-fuzz --no-default-features
      - run: cargo test --workspace --exclude xylogue-cli --exclude xylogue-fuzz --no-default-features --features encodings
      - run: cargo test -p xylogue-parser --no-default-features --features tokio
      # Each optional layer built on its own, so a feature that only compiles alongside another
      # does not slip through the all-features and no-features runs.
      - run: cargo test -p xylogue-parser --no-default-features --features xml-base
      - run: cargo test -p xylogue-parser --no-default-features --features xml-id
      - run: cargo test -p xylogue-validate --no-default-features --features xml-id
      - run: cargo test -p xylogue-dom --no-default-features --features parse
      - run: cargo test -p xylogue-xinclude --no-default-features --features encodings
      # `icu` changes what xsl:sort *answers*, not just how fast it is, so the build without it
      # is exercised rather than assumed to behave the same.
      - run: cargo test -p xylogue-xslt --no-default-features
      - run: cargo test -p xylogue-xslt --no-default-features --features icu
      # Without `encodings`, an xsl:output encoding other than UTF-8 must be refused by name
      # rather than written wrongly, which only this build exercises.
      - run: cargo test -p xylogue-xslt --no-default-features --features encodings
      # Each EXSLT module on its own, so that `function-available()` agreeing with the features
      # is checked in the builds where they differ, not only where they are all on.
      - run: cargo test -p xylogue-exslt --no-default-features
      - run: cargo test -p xylogue-exslt --no-default-features --features common
      - run: cargo test -p xylogue-exslt --no-default-features --features math
      - run: cargo test -p xylogue-exslt --no-default-features --features sets
      - run: cargo test -p xylogue-exslt --no-default-features --features strings
      - run: cargo test -p xylogue-exslt --no-default-features --features dates
      - run: cargo test -p xylogue-exslt --no-default-features --features regexp
      # The report of what the specifications leave open is worth seeing in the build where the
      # collation answer is the other one.
      - run: cargo test -p xylogue --no-default-features --features parse --test behaviour -- --nocapture

  conformance:
    # The W3C suite is thousands of files and is not vendored; it is fetched here so the
    # parser and validator are measured against something they did not write, on every push
    # rather than only when someone remembers.
    name: W3C conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the XML conformance suite
        run: |
          curl -sSfL -o xmlts.tar.gz https://www.w3.org/XML/Test/xmlts20130923.tar.gz
          tar xf xmlts.tar.gz
      - name: Parser conformance (well-formedness)
        run: cargo test -p xylogue-parser --test conformance -- --nocapture
        env:
          XMLCONF: ${{ github.workspace }}/xmlconf
      - name: Validator conformance (validity)
        run: cargo test -p xylogue-validate --all-features --test conformance -- --nocapture
        env:
          XMLCONF: ${{ github.workspace }}/xmlconf
      # Printed on every run so that what the specifications leave open, and what this build
      # answers, is on the record beside the conformance figures rather than only in prose.
      - name: Report the behaviour the specifications leave open
        run: cargo test -p xylogue --all-features --test behaviour -- --nocapture

  differential:
    # Java is the implementation this library sets out to agree with, so the comparison against
    # it runs on every push rather than when someone remembers. The JDK ships its own XPath
    # engine, so nothing but a JDK is needed.
    name: differential against Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Printed, so that the count compared and any recorded divergence are on the record beside
      # the conformance figures rather than only in prose.
      - run: cargo test -p xylogue-xpath --test differential -- --nocapture
        env:
          XYLOGUE_JAVA: java

  fuzz:
    # A short run on every push. It will not exhaust anything in a minute a target; what it is
    # for is that the targets still build and that an obvious crash cannot land unnoticed. The
    # properties themselves are checked on every platform by `crates/xylogue-fuzz`'s corpus
    # test, which needs no nightly.
    name: fuzzing (short run)
    runs-on: ubuntu-latest
    env:
      # cargo-fuzz supplies its own flags; -D warnings here would fight them for no gain.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      # The same script one runs locally, so the two cannot drift apart.
      - run: ./fuzz/short-run.sh 60
      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-features
