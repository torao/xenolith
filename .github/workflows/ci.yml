name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  features:
    # The feature policy (see ROADMAP.md §6) promises that a build with every optional
    # capability removed still works, so the minimal configuration is built and tested here
    # rather than being assumed.
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `xenolith-fuzz` is left out of these two: it names the library's features outright, so
      # building it alongside would unify the features back on and the minimal configuration — the
      # thing this job exists to build — would never be built at all. `xenolith-cli` does the same
      # and returns to the workspace with the layers it drives.
      - run: cargo test --workspace --exclude xenolith-fuzz --no-default-features
      - run: cargo test --workspace --exclude xenolith-fuzz --no-default-features --features encodings
      # The parser's own optional pieces, each on its own: `async` is the runtime-agnostic driver
      # and `tokio` the adapters over it, and neither is built by the runs above.
      - run: cargo test -p xenolith --no-default-features --features async
      - run: cargo test -p xenolith --no-default-features --features tokio
      # The layers built on the vocabulary are parked outside the workspace while it settles, so
      # the steps that built each of them on its own are parked with them: `xenolith-xinclude`,
      # `xenolith-xslt` (with and without `icu` and `encodings`), each EXSLT module, and the
      # report of what the specifications leave open. They return with the crates.

  conformance:
    # The W3C suite is thousands of files and is not vendored; it is fetched here so the
    # parser and validator are measured against something they did not write, on every push
    # rather than only when someone remembers.
    name: W3C conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the XML conformance suite
        run: |
          curl -sSfL -o xmlts.tar.gz https://www.w3.org/XML/Test/xmlts20130923.tar.gz
          tar xf xmlts.tar.gz
      - name: Parser conformance (well-formedness)
        run: cargo test -p xenolith --test parser_conformance -- --nocapture
        env:
          XMLCONF: ${{ github.workspace }}/xmlconf
      - name: Validator conformance (validity)
        run: cargo test -p xenolith --all-features --test validate_conformance -- --nocapture
        env:
          XMLCONF: ${{ github.workspace }}/xmlconf
      # What the specifications leave open, and what this build answers, is recorded in the
      # README. The test that printed it spanned the crates that are parked, and returns with them.

  differential:
    # Java is the implementation this library sets out to agree with, so the comparison against
    # it runs on every push rather than when someone remembers. The JDK ships its own XPath
    # engine, so nothing but a JDK is needed.
    #
    # What it compares is `xenolith-xpath`, which is parked outside the workspace while the event
    # vocabulary settles, so there is nothing for it to run. The job stays here, switched off, so
    # that turning it back on is one line rather than an archaeology exercise.
    name: differential against Java
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Printed, so that the count compared and any recorded divergence are on the record beside
      # the conformance figures rather than only in prose.
      - run: cargo test -p xenolith-xpath --test differential -- --nocapture
        env:
          XYLOGUE_JAVA: java

  fuzz:
    # A short run on every push. It will not exhaust anything in a minute a target; what it is
    # for is that the targets still build and that an obvious crash cannot land unnoticed. The
    # properties themselves are checked on every platform by `crates/xenolith-fuzz`'s corpus
    # test, which needs no nightly.
    name: fuzzing (short run)
    runs-on: ubuntu-latest
    env:
      # cargo-fuzz supplies its own flags; -D warnings here would fight them for no gain.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      # The same script one runs locally, so the two cannot drift apart.
      - run: ./fuzz/short-run.sh 60
      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-features
