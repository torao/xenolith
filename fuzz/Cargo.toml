[package]
name = "xenolith-fuzz-targets"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The properties live in the workspace so that `cargo test` checks them too; these targets only
# feed them bytes. See that crate's documentation for what each one asserts.
xenolith-fuzz = { path = "../crates/xenolith-fuzz" }

[[bin]]
name = "parse_document"
path = "fuzz_targets/parse_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "build_and_serialize"
path = "fuzz_targets/build_and_serialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate_document"
path = "fuzz_targets/validate_document.rs"
test = false
doc = false
bench = false

# The targets over XPath expressions (`compile_expression`) and XSLT stylesheets (`transform`)
# are not built: the properties they call belong to `xenolith-xpath` and `xenolith-xslt`, which
# are parked outside the workspace while the event vocabulary settles. The target files and their
# corpora stay where they are, and the entries return with the crates.
