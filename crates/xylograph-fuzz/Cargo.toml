[package]
name = "xylograph-fuzz"
description = "The properties xylograph is fuzzed against, and a corpus that replays them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# A test-support crate: it exists so that the fuzz targets and the ordinary test suite check the
# same properties. Nothing depends on it.
publish = false

[dependencies]
# The features the properties need named outright, as the CLI does — see the note in ci.yml about
# why this crate is left out of the workspace-wide no-default-features runs.
xylograph-core = { workspace = true }
xylograph-parser = { workspace = true, features = ["encodings", "xml-base", "xml-id"] }
xylograph-validate = { workspace = true, features = ["encodings", "xml-id"] }
xylograph-dom = { workspace = true, features = ["parse"] }
xylograph-serialize = { workspace = true }
xylograph-xdm = { workspace = true }
xylograph-xpath = { workspace = true }
xylograph-xslt = { workspace = true, features = ["encodings"] }

[lints]
workspace = true
