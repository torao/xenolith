[package]
name = "xylograph-core"
description = "Core primitives for the xylograph XML toolchain: errors, names, XML character classes, URIs and character decoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["encodings"]
# Support for encodings beyond UTF-8/UTF-16/US-ASCII/ISO-8859-1, via `encoding_rs`.
encodings = ["dep:encoding_rs"]

[dependencies]
encoding_rs = { workspace = true, optional = true }

[lints]
workspace = true
