[package]
name = "xenolith-xslt"
description = "XSLT 1.0 for xenolith: patterns, stylesheets, and the transformation engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
# A stylesheet is a template, and this is the engine that runs one.
categories = ["template-engine", "text-processing", "parser-implementations"]

[features]
default = ["icu"]
# Language-aware collation for `xsl:sort`. Without it, sorting compares by Unicode code point,
# which is a defensible answer but not the one a reader of a given language expects.
icu = ["dep:icu_collator", "dep:icu_locale_core"]
# Writing a result in an encoding other than UTF-8, as `xsl:output encoding` may ask.
encodings = ["dep:encoding_rs"]

[dependencies]
xenolith-core = { workspace = true }
xenolith-dom = { workspace = true, features = ["parse"] }
xenolith-xdm = { workspace = true }
xenolith-xpath = { workspace = true }
icu_collator = { workspace = true, optional = true }
icu_locale_core = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }

[dev-dependencies]
xenolith-serialize = { workspace = true }
# The conformance harness drives the parser itself, to give it a resolver for the DTDs that sit
# beside the suite's data files.
xenolith-parser = { workspace = true }

[lints]
workspace = true
