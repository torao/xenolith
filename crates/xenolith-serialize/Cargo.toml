[package]
name = "xenolith-serialize"
description = "XML serialization for xenolith: a DOM tree to well-formed XML text, with escaping, indentation and namespace repair"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Encodings beyond UTF-8, US-ASCII and ISO-8859-1 on the way out, via `encoding_rs`. Without it those three are
# what a writer can produce, and any other name is an error saying so.
encodings = ["xenolith-core/encodings"]
# Validate as you write: the `ValidatingWriter`, which checks each write against a schema before it is emitted.
validate = ["dep:xenolith-validate"]

[dependencies]
xenolith-core = { workspace = true }
xenolith-dom = { workspace = true }
xenolith-validate = { workspace = true, optional = true }

[dev-dependencies]
xenolith-dom = { workspace = true, features = ["parse"] }
# For the test that writes through a DTD read as a schema of its own.
xenolith-parser = { workspace = true }

[lints]
workspace = true
