[package]
name = "xenolith-xinclude"
description = "XInclude 1.0 processing for xenolith: a DOM post-processing pass that expands xi:include"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Decode included text resources in encodings beyond UTF-8/UTF-16/US-ASCII/ISO-8859-1.
encodings = ["xenolith-core/encodings", "xenolith-dom/encodings"]

[dependencies]
xenolith-core = { workspace = true }
xenolith-dom = { workspace = true, features = ["parse"] }

[dev-dependencies]
xenolith-serialize = { workspace = true }

[lints]
workspace = true
