[package]
name = "xylogue"
description = "A native Rust implementation of XML processing and XSLT 1.0, aiming for parity with Java's XML APIs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["encodings", "parse", "icu", "exslt"]
# EXSLT extension functions for XSLT: xylogue::exslt. Inter-crate dependencies have their
# default features off (see the feature policy in ROADMAP.md), so the modules are named here —
# without this the crate would be present with nothing in it, and every EXSLT call would fail.
exslt = [
  "dep:xylogue-exslt",
  "xylogue-exslt/common",
  "xylogue-exslt/dates",
  "xylogue-exslt/math",
  "xylogue-exslt/regexp",
  "xylogue-exslt/sets",
  "xylogue-exslt/strings",
]
# Language-aware collation for `xsl:sort`, from CLDR through ICU4X. Without it, a text sort
# compares by Unicode code point; see `tests/behaviour.rs`.
icu = ["xylogue-xslt/icu"]
# Encodings beyond UTF-8/UTF-16/US-ASCII/ISO-8859-1, via `encoding_rs`.
encodings = [
  "xylogue-core/encodings",
  "xylogue-parser/encodings",
  "xylogue-validate/encodings",
  "xylogue-dom/encodings",
  "xylogue-xinclude?/encodings",
  "xylogue-xslt/encodings",
]
# Build a DOM from parsed XML: xylogue::dom::build.
parse = ["xylogue-dom/parse"]
# XInclude processing: xylogue::xinclude. A resource-fetching layer, so opt-in.
xinclude = ["dep:xylogue-xinclude"]
# The asynchronous reader, over tokio's AsyncRead.
tokio = ["xylogue-parser/tokio"]
# Per-node base URI computation from xml:base and the entity's system id (XML Base).
xml-base = ["xylogue-parser/xml-base"]
# xml:id as an ID-typed attribute, and its NCName/uniqueness checking in validation.
xml-id = ["xylogue-parser/xml-id", "xylogue-validate/xml-id"]

[dependencies]
xylogue-core = { workspace = true }
xylogue-parser = { workspace = true }
xylogue-validate = { workspace = true }
xylogue-dom = { workspace = true }
xylogue-serialize = { workspace = true }
xylogue-xdm = { workspace = true }
xylogue-xpath = { workspace = true }
xylogue-xslt = { workspace = true }
xylogue-xinclude = { workspace = true, optional = true }
xylogue-exslt = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

# The end-to-end benchmarks: the facade is where every layer is reachable at once, which is what
# a caller's own numbers look like. `cargo test --benches` runs each once, so they cannot rot.
[[bench]]
name = "pipeline"
harness = false

[lints]
workspace = true
