[package]
name = "xylograph"
description = "A native Rust implementation of XML processing and XSLT 1.0, aiming for parity with Java's XML APIs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["encodings", "parse", "icu", "exslt"]
# EXSLT extension functions for XSLT: xylograph::exslt. Inter-crate dependencies have their
# default features off (see the feature policy in ROADMAP.md), so the modules are named here —
# without this the crate would be present with nothing in it, and every EXSLT call would fail.
exslt = [
  "dep:xylograph-exslt",
  "xylograph-exslt/common",
  "xylograph-exslt/dates",
  "xylograph-exslt/math",
  "xylograph-exslt/regexp",
  "xylograph-exslt/sets",
  "xylograph-exslt/strings",
]
# Language-aware collation for `xsl:sort`, from CLDR through ICU4X. Without it, a text sort
# compares by Unicode code point; see `tests/behaviour.rs`.
icu = ["xylograph-xslt/icu"]
# Encodings beyond UTF-8/UTF-16/US-ASCII/ISO-8859-1, via `encoding_rs`.
encodings = [
  "xylograph-core/encodings",
  "xylograph-parser/encodings",
  "xylograph-validate/encodings",
  "xylograph-dom/encodings",
  "xylograph-xinclude?/encodings",
  "xylograph-xslt/encodings",
]
# Build a DOM from parsed XML: xylograph::dom::build.
parse = ["xylograph-dom/parse"]
# XInclude processing: xylograph::xinclude. A resource-fetching layer, so opt-in.
xinclude = ["dep:xylograph-xinclude"]
# The asynchronous reader, over tokio's AsyncRead.
tokio = ["xylograph-parser/tokio"]
# Per-node base URI computation from xml:base and the entity's system id (XML Base).
xml-base = ["xylograph-parser/xml-base"]
# xml:id as an ID-typed attribute, and its NCName/uniqueness checking in validation.
xml-id = ["xylograph-parser/xml-id", "xylograph-validate/xml-id"]

[dependencies]
xylograph-core = { workspace = true }
xylograph-parser = { workspace = true }
xylograph-validate = { workspace = true }
xylograph-dom = { workspace = true }
xylograph-serialize = { workspace = true }
xylograph-xdm = { workspace = true }
xylograph-xpath = { workspace = true }
xylograph-xslt = { workspace = true }
xylograph-xinclude = { workspace = true, optional = true }
xylograph-exslt = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

# The end-to-end benchmarks: the facade is where every layer is reachable at once, which is what
# a caller's own numbers look like. `cargo test --benches` runs each once, so they cannot rot.
[[bench]]
name = "pipeline"
harness = false

[lints]
workspace = true
