[package]
name = "xenolith-validate"
description = "Validation for xenolith: a schema-agnostic Validator interface, with a DTD validator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["encodings"]
encodings = ["xenolith-parser/encodings"]
# Check xml:id attributes: a valid NCName, unique in the document (reuses the ID machinery).
xml-id = ["xenolith-parser/xml-id"]

[dependencies]
xenolith-core = { workspace = true }
xenolith-parser = { workspace = true }

[dev-dependencies]
xenolith-parser = { workspace = true, features = ["encodings"] }

[lints]
workspace = true
